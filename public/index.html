<script>


// ===== V2 SECURITY + MAP + MAC VALIDATION (no client duplicate check) =====
(function(){
  // --- 1. Password Hashing (SHA-256) ---
  async function sha256(str){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  window._hashPassword = sha256;
  window._isHashed = (s)=> /^[a-f0-9]{64}$/i.test(s||'');

  // Hook localStorage save to auto-hash users
  const origSetItem = localStorage.setItem.bind(localStorage);
  localStorage.setItem = function(key, val){
    try{
      if(key==='carnival_local_state'){
        let obj = JSON.parse(val);
        if(obj.users && Array.isArray(obj.users)){
          // Hash passwords async? We do sync check - mark for hashing
          obj.users = obj.users.map(u=>{
            if(u.password && !window._isHashed(u.password)){
              // Keep plain for backward compat in memory but mark hashed version in _hp
              // We will hash later via async
              u._plain = u.password;
            }
            return u;
          });
          val = JSON.stringify(obj);
          // Async hash in background
          (async()=>{
            let changed=false;
            for(let u of obj.users){
              if(u._plain && !window._isHashed(u.password)){
                u.password = await sha256(u._plain);
                delete u._plain;
                changed=true;
              }
            }
            if(changed){
              origSetItem(key, JSON.stringify(obj));
              // Also update Supabase users table
              if(window._sb){
                try{ await window._sb.from('users').upsert(obj.users, {onConflict:'id'}); }catch(e){}
              }
            }
          })();
        }
      }
    }catch(e){}
    return origSetItem(key, val);
  };

  // --- 2. MAC Validation ---
  window.validateMac = function(mac){
    if(!mac || mac.trim()==='') return true; // allow empty
    const re = /^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$/;
    return re.test(mac.trim());
  };
  window.validateMacMessage = "Invalid MAC! Format: A4:CF:12:5B:1E:FF or A4-CF-12-5B-1E-FF";

  // Intercept form submit globally
  document.addEventListener('submit', function(e){
    const form = e.target;
    const inputs = form.querySelectorAll('input');
    let invalid=null;
    inputs.forEach(inp=>{
      const label = (form.textContent||'').toLowerCase();
      const isMacField = inp.placeholder && inp.placeholder.toLowerCase().includes('mac') || 
                         (inp.previousElementSibling && /mac/i.test(inp.previousElementSibling.textContent||'')) ||
                         /router|onu/i.test(inp.getAttribute('name')||'') ||
                         /MAC/i.test(inp.parentElement?.textContent||'');
      // More robust: check if input value looks like MAC attempt and validate
      const val = inp.value||'';
      if(val && (val.includes(':') || val.includes('-')) && val.length>=8){
        // If contains colon and length suggests MAC, validate if parent mentions MAC
        const parentText = inp.closest('div')?.querySelector('label')?.textContent||'';
        if(/MAC/i.test(parentText)){
          if(!window.validateMac(val)){
            invalid = parentText + ': ' + window.validateMacMessage;
            inp.style.borderColor = 'rgb(239 68 68)';
            inp.title = window.validateMacMessage;
          } else {
            inp.style.borderColor = '';
          }
        }
      }
    });
    if(invalid){
      e.preventDefault();
      e.stopPropagation();
      alert(invalid);
      return false;
    }
  }, true);

  // --- 3. Leaflet Map Integration (Free, no API key) ---
  const mapCss = document.createElement('link');
  mapCss.rel = 'stylesheet';
  mapCss.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
  document.head.appendChild(mapCss);
  const mapJs = document.createElement('script');
  mapJs.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  document.head.appendChild(mapJs);

  window.openMapModal = function(lat, lng, name){
    if(!lat || !lng) { alert('Latitude/Longitude not set'); return; }
    let modal = document.getElementById('carnival-map-modal');
    if(!modal){
      modal = document.createElement('div');
      modal.id='carnival-map-modal';
      modal.style.cssText='position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px)';
      modal.innerHTML = `
        <div style="background:white;width:90%;max-width:600px;height:70%;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.3);display:flex;flex-direction:column">
          <div style="padding:16px 20px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center">
            <div><div style="font-weight:700;font-size:15px" id="map-title">${name||'Location'}</div><div style="font-size:11px;color:#6b7280;font-family:monospace">${lat}, ${lng}</div></div>
            <button onclick="document.getElementById('carnival-map-modal').remove()" style="width:32px;height:32px;border-radius:10px;background:#f3f4f6;display:flex;align-items:center;justify-content:center">✕</button>
          </div>
          <div id="carnival-map" style="flex:1"></div>
          <div style="padding:12px 20px;border-top:1px solid #f3f4f6;display:flex;gap:8px">
            <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" style="flex:1;height:40px;background:#0f172a;color:white;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500">Open in Google Maps</a>
            <button onclick="navigator.clipboard.writeText('${lat}, ${lng}'); this.textContent='Copied!'; setTimeout(()=>this.textContent='Copy Coords',1500)" style="height:40px;padding:0 16px;border:1px solid #e5e7eb;border-radius:12px;font-size:13px">Copy Coords</button>
          </div>
        </div>
      `;
      modal.addEventListener('click', (e)=>{ if(e.target===modal) modal.remove(); });
      document.body.appendChild(modal);
    } else {
      document.getElementById('map-title').textContent = name||'Location';
    }
    setTimeout(()=>{
      if(!window.L) { setTimeout(()=>window.openMapModal(lat,lng,name), 500); return; }
      const mapDiv = document.getElementById('carnival-map');
      if(mapDiv._leaflet_id){ mapDiv._leaflet_id=null; mapDiv.innerHTML=''; }
      const map = L.map('carnival-map').setView([parseFloat(lat), parseFloat(lng)], 16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'© OpenStreetMap'}).addTo(map);
      L.marker([parseFloat(lat), parseFloat(lng)]).addTo(map).bindPopup(name||`${lat}, ${lng}`).openPopup();
      setTimeout(()=>map.invalidateSize(), 200);
    }, 100);
  };

  // Inject Map buttons into cards via MutationObserver
  const observer = new MutationObserver(()=>{
    document.querySelectorAll('div.bg-white').forEach(card=>{
      if(card.dataset.mapInjected) return;
      const text = card.textContent||'';
      // Find lat/lng pattern in card
      const hasCoords = /23\.\d+|90\.\d+/.test(card.innerHTML) || card.innerHTML.includes('lat') || card.innerHTML.includes('Latitude');
      if(!hasCoords) return;
      // Try to extract lat/lng from card's data or text
      let lat=null,lng=null;
      const mono = card.querySelectorAll('.font-mono');
      mono.forEach(el=>{
        const t = el.textContent||'';
        const m = t.match(/([0-9]{2}\.[0-9]+)\s*,\s*([0-9]{2}\.[0-9]+)/);
        if(m){ lat=m[1]; lng=m[2]; }
      });
      if(!lat){
        const html = card.innerHTML;
        const m = html.match(/lat[\":\s]*([0-9]+\.[0-9]+)[\s\S]{0,30}lng[\":\s]*([0-9]+\.[0-9]+)/i);
        if(m){ lat=m[1]; lng=m[2]; }
      }
      if(lat && lng){
        const btn = document.createElement('button');
        btn.textContent = '📍 Map';
        btn.style.cssText='margin-top:8px;height:28px;padding:0 10px;border-radius:8px;background:#eef2ff;color:#1e40af;font-size:11px;font-weight:600;border:1px solid #e0e7ff';
        btn.onclick = (e)=>{ e.stopPropagation(); window.openMapModal(lat,lng, card.querySelector('h3, .font-semibold')?.textContent||'Location'); };
        // Append near bottom
        const actionArea = card.querySelector('.flex.gap-2.mt-4') || card;
        actionArea.appendChild(btn);
        card.dataset.mapInjected='1';
      }
    });
  });
  observer.observe(document.body, {childList:true, subtree:true});

  console.log('✅ V2 Patches Loaded: Password Hash + MAC Validation + Leaflet Map (No Client Duplicate Check)');
})();


</script>

          if(!phone && (/^01[0-9]{9}$/.test(clean) || /^\+8801/.test(clean))){ phone = l; continue; }
          if(!lat && l.includes(",") && /\d+\.\d+/.test(l)){
            const p = l.split(","); if(p.length===2 && p[0].match(/\d+\.\d+/) && p[1].match(/\d+\.\d+/)){ lat=p[0].trim(); lng=p[1].trim(); continue; }
          }
          if(!cable && (l.toLowerCase().includes("drop") || l.toLowerCase().includes("odf"))){ cable = l.replace(/Cable ID:\s*/i,"").replace(/Cable:\s*/i,"").trim(); continue; }
          if(!addr && (l.includes("Road") || l.includes("House") || l.includes("Flat") || l.includes("Block") || l.includes("Dhaka") || l.includes("Floor") || l.includes("Area"))){ addr = l; continue; }
          if(!name && l.length>=3 && l.length<60 && !l.includes(",") && !/^01/.test(l) && !l.toLowerCase().includes("odf") && !l.toLowerCase().includes("drop")){ name = l; }
        }
        window.__clientTooltipData[cid] = {clientId:cid, name, address:addr, phone, lat, lng, cableInfo:cable};
      }
    }catch(e){}
  }
  function clientMessage(card){
    let clientId="", clientName="", clientAddress="", contactNumber="", clientLat="", clientLng="", cableInfo="";
    try{
      const m = (card.textContent||"").match(/CL-\d+/); if(m) clientId = m[0];
      const state = getState();
      const allClients = state.clients || [];
      let obj = null;
      const cid = card.id? card.id.replace('client-','') : "";
      if(cid) obj = allClients.find(c => String(c.id)===String(cid));
      if(!obj && clientId) obj = allClients.find(c => String(c.clientId)===String(clientId));
      if(!obj){
        const btn = card.querySelector('[class*="wa-client"]');
        if(btn && btn._clientData) obj = btn._clientData;
      }
      if(obj){
        clientId = obj.clientId || obj.client_id || clientId;
        clientName = obj.name || "";
        clientAddress = obj.address || "";
        contactNumber = obj.phone || obj.mobile || "";
        clientLat = obj.lat || obj.latitude || "";

      if(clientId && window.__clientTooltipData[clientId]){

        if(!clientLng) clientLng = t.lng||"";
        if(!cableInfo) cableInfo = t.cableInfo||"";
      }
    }catch(e){}
    let splitterName="", splitterAddr="", splitterLat="", splitterLng="";
    try{
      const state = getState();
      const allSecond = state.second_splitters || state.secondSplitters || [];
      const allH3 = document.querySelectorAll('h3');
      for(let h of allH3){
        const t = (h.innerText||"").trim();
        if(t.includes("•") && /1:(2|4|8|16|32)/.test(t)){ splitterName = t.split("•")[0].trim(); break; }
      }
      if(splitterName){
        let sObj = allSecond.find(s => String(s.name).trim()===String(splitterName).trim());
        if(sObj){ splitterAddr = sObj.address || ""; splitterLat = sObj.lat || sObj.latitude || ""; splitterLng = sObj.lng || sObj.longitude || ""; }
        if(!splitterAddr){
          const whiteCards = document.querySelectorAll('div.bg-white');
          for(let wc of whiteCards){
            const txt = (wc.innerText||"");
            if(txt.includes(splitterName) && txt.includes("Max")){
              const p = wc.querySelector('p');
              if(p) splitterAddr = (p.innerText||"").split("•")[0].trim();
              break;
            }
          }
        }
      }
    }catch(e){}
    const lines = [];
    if(clientId) lines.push(clientId);
    if(clientName) lines.push(clientName);
    if(clientAddress) lines.push(clientAddress);
    if(contactNumber) lines.push(contactNumber);
    if(clientLat || clientLng){ if(clientLat && clientLng) lines.push(clientLat + ", " + clientLng); else lines.push(clientLat || clientLng); }
    if(cableInfo) lines.push(cableInfo);
    lines.push("");
    lines.push("Splitter info :");
    if(splitterName) lines.push(splitterName);
    if(splitterAddr) lines.push(splitterAddr);
    if(splitterLat || splitterLng){ if(splitterLat && splitterLng) lines.push(splitterLat + ", " + splitterLng); else lines.push(splitterLat || splitterLng); }
    return lines.join("\n");
  }
  function splitterMessage(card, type){
    let name="", typeVal="", address="", lat="", lng="", cableId="", length="";
    try{
      const h3 = card.querySelector('h3'); if(h3) name = (h3.innerText||"").replace(/\s+/g," ").trim();
      const spans = Array.from(card.querySelectorAll('span'));
      for(let s of spans){ const t = (s.innerText||"").trim(); if(/^1:(2|4|8|16|32)$/i.test(t)){ typeVal = t; break; } }
      const ps = Array.from(card.querySelectorAll('p'));
      if(ps.length>=1) address = ps[0].innerText.trim();
      if(ps.length>=2){ const ll = ps[1].innerText.trim(); if(ll.includes(",")){ const pr = ll.split(","); lat=pr[0].trim(); lng=pr[1].trim(); } }
      if(ps.length>=3) cableId = ps[2].innerText.trim();
      if(ps.length>=4) length = ps[3].innerText.trim();
      if(!address || !lat){
        const state = getState();
        const list = type==="first" ? (state.first_splitters||state.firstSplitters||[]) : (state.second_splitters||state.secondSplitters||[]);
        const found = list.find(s=> s.name===name);
        if(found){ if(!address) address = found.address||""; if(!lat) lat = found.lat||found.latitude||""; if(!lng) lng = found.lng||found.longitude||""; if(!cableId) cableId = found.cableDrum||found.cable_drum||""; if(!length) length = found.cableInfo||found.cable_info||""; if(!typeVal) typeVal = found.type||""; }
      }
    }catch(e){}
    const out=[]; if(name) out.push(name); if(typeVal) out.push(typeVal); if(address) out.push(address); if(lat||lng) out.push((lat&&lng)?lat+", "+lng:(lat||lng)); if(cableId) out.push(cableId); if(length) out.push(length);
    return out.join("\n") || "No data";
  }
  function addSplitterButton(card, type){
    if (!card || injectedCards.has(card)) return;
    if (card.querySelector('[class*="wa-splitter-btn"]')) { injectedCards.add(card); return; }
    if (getComputedStyle(card).position === "static") card.style.position = "relative";

    btn.onclick = function(e){ e.preventDefault(); e.stopPropagation(); whatsappOpen(splitterMessage(card, type)); };
    card.appendChild(btn);
    injectedCards.add(card);

  function addClientButton(card){
    if (!card || injectedCards.has(card)) return;
    if (card.querySelector('[class*="wa-client-btn"]')) { injectedCards.add(card); return; }
    if (getComputedStyle(card).position === "static") card.style.position = "relative";

    try{
      const state = getState();
      const allClients = state.clients||[];
      let cid = card.id ? card.id.replace('client-','') : "";
      let obj = null;
      if(cid) obj = allClients.find(c=> String(c.id)===String(cid));
      if(!obj){ const m = (card.textContent||"").match(/CL-\d+/); if(m) obj = allClients.find(c=> String(c.clientId)===String(m[0])); }
      if(obj) btn._clientData = obj;
    }catch(e){}
    btn.onclick = function(e){ e.preventDefault(); e.stopPropagation(); whatsappOpen(clientMessage(card)); };
    card.appendChild(btn);
    injectedCards.add(card);
  }
  function getCards(){
    const clientCards = Array.from(document.querySelectorAll('div[id^="client-"]'));
    const mainRoot = document.querySelector('main') || document.getElementById('root') || document.body;
    const splitterCandidates = mainRoot.querySelectorAll('div.bg-white');
    const splitterCards = Array.from(splitterCandidates).filter(el=>{
      if(el.id && el.id.startsWith('client-')) return false;
      const t = (el.innerText||"");
      return t.includes("Edit") && t.includes("Delete") && t.length<1000;
    });
    return {clientCards, splitterCards};
  }
  function run(){
    const h1 = (document.querySelector("h1")?.innerText||"").toLowerCase();
    if(h1.includes("olt") || (h1.includes("port") && !h1.includes("splitter")) || h1.includes("zone") || (h1.includes("pop") && !h1.includes("splitter"))){
      return;
    }
    const {clientCards, splitterCards} = getCards();
    if(clientCards.length>0){ clientCards.forEach(addClientButton); }
    if(h1.includes("1st") || h1.includes("2nd")){
      const type = h1.includes("1st") ? "first" : "second";
      splitterCards.forEach(card=> addSplitterButton(card, type));
    }
    parseTooltipAndStore();
  }
  function scheduleRun(){
    if(runScheduled) return;
    runScheduled = true;
    requestAnimationFrame(()=>{ runScheduled=false; run(); });
  }
  function init(){
    run();
    const observer = new MutationObserver((mutations)=>{
      for(const m of mutations){
        if(m.addedNodes.length>0){ scheduleRun(); break; }
      }
    });
    observer.observe(document.body, {childList:true, subtree:true});
    window.addEventListener('load', ()=>{ setTimeout(run, 500); });
    setInterval(parseTooltipAndStore, 1000);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
  console.log("WHATSAPP V6 - RLS SAFE + PERFORMANCE FIX ACTIVE");
})();
</script>

<script>
// ===== CARNIVAL V7 - PERMISSION + DUPLICATE CHECK =====
(function(){
  if(window.__carnivalV7Permission) return;
  window.__carnivalV7Permission = true;

  // --- 1. Permission System ---
  function getCurrentUser(){
    try{
      const au = localStorage.getItem('carnival_auth_user');
      if(au) return JSON.parse(au);
      const fu = localStorage.getItem('fibernet_user');
      if(fu) return JSON.parse(fu);
      const ls = localStorage.getItem('carnival_local_state');
      if(ls){
        const st = JSON.parse(ls);
        // fallback to first user
        if(st.users && st.users.length) return st.users[0];
      }
    }catch(e){}
    return {username:'guest', role:'viewer'};
  }

  function getPermissions(){
    const user = getCurrentUser();
    // If custom permissions object exists
    if(user.permissions){
      return {
        canAdd: !!user.permissions.add,
        canEdit: !!user.permissions.edit,
        canDelete: !!user.permissions.delete
      };
    }
    // Role based default
    const role = (user.role||'').toLowerCase();
     if(role==='viewer' || role==='read') return {canAdd:false,canEdit:false,canDelete:false};
     if(role==='write' || role==='installer' || role==='editor' || role==='staff') return {canAdd:true,canEdit:true,canDelete:true};
    if(role==='admin') return {canAdd:true, canEdit:true, canDelete:true};
    if(role==='manager') return {canAdd:true, canEdit:true, canDelete:false};
    if(role==='editor' || role==='staff') return {canAdd:true, canEdit:true, canDelete:false};
    if(role==='viewer') return {canAdd:false, canEdit:false, canDelete:false};
    // Default for any other user - only edit
    return {canAdd:false, canEdit:true, canDelete:false};
  }

  window.getCurrentUser = getCurrentUser;
  window.getPermissions = getPermissions;

  // --- 2. Enforce Permission on UI ---
  function enforcePermissions(){
    const perm = getPermissions();
    const user = getCurrentUser();
    // Find all buttons
    const allButtons = document.querySelectorAll('button');
    allButtons.forEach(btn=>{
      const txt = (btn.innerText||'').trim().toLowerCase();
      // Add / New Client / New Splitter etc
      if(txt.includes('add') || txt.includes('new') || txt === '+' || btn.textContent.trim()==='+ Add Client'){
        // Keep add buttons for zones/pops etc? We restrict only if canAdd false
        if(!perm.canAdd){
          // Allow view but disable
          if(txt.includes('client') || txt.includes('splitter') || btn.closest('[class*="client"]') || document.querySelector('h1')?.innerText.toLowerCase().includes('client')){
            btn.style.opacity = '0.4';
            btn.style.pointerEvents = 'none';
            btn.title = 'No permission to Add (Role: '+user.role+')';
          }
        }
      }
      if(txt === 'edit'){
        if(!perm.canEdit){
          btn.style.display = 'none';
        }
      }
      if(txt === 'delete'){
        if(!perm.canDelete){
          btn.style.display = 'none';
        }
      }
    });

    // Also hide floating Add buttons (usually bottom right)
    const fab = document.querySelectorAll('button.fixed, a.fixed');
    fab.forEach(btn=>{
      const t = (btn.innerText||'').toLowerCase();
      if(t.includes('add') && !perm.canAdd){
        btn.style.display='none';
      }
    });
  }

  // --- 3. Client ID Duplicate Check ---
  function getStateSafe(){
    try{
      const s = localStorage.getItem('carnival_local_state');
      if(s) return JSON.parse(s);
    }catch(e){}
    return {clients:[]};
  }

  function isDuplicateClientId(newId, editingId){
    if(!newId) return false;
    const state = getStateSafe();
    const clients = state.clients || [];
    const norm = String(newId).trim().toLowerCase();
    return clients.some(c=>{
      const existingId = String(c.clientId||c.client_id||'').trim().toLowerCase();
      if(!existingId) return false;
      if(editingId && String(editingId).trim().toLowerCase() === existingId) return false; // same record editing
      return existingId === norm;
    });
  }

  // Intercept form submit for client add/edit
  document.addEventListener('submit', function(e){
    const form = e.target;
    const formText = (form.innerText||'').toLowerCase();
    const isClientForm = formText.includes('client id') || form.querySelector('input[placeholder*="CL-"]') || form.querySelector('input[name*="client"]');
    // More generic: check if any input looks like CL-
    const inputs = form.querySelectorAll('input');
    let clientIdInput = null;
    let editingId = null;
    // Try to find clientId field
    inputs.forEach(inp=>{
      const ph = (inp.placeholder||'').toLowerCase();
      const label = inp.closest('div')?.querySelector('label')?.textContent.toLowerCase()||'';
      if(ph.includes('cl-') || label.includes('client id') || label.includes('clientid')){
        clientIdInput = inp;
      }
      // If input has value like CL-001 and form is edit, keep original
      if(inp.dataset && inp.dataset.originalId){
        editingId = inp.dataset.originalId;
      }
    });
    // Fallback: first input that matches CL- pattern
    if(!clientIdInput){
      inputs.forEach(inp=>{
        if(/^CL-\d+/i.test(inp.value||'')){
          clientIdInput = inp;
        }
      });
    }

    if(clientIdInput){
      const newId = (clientIdInput.value||'').trim();
      // Get editingId from form dataset or from state
      if(!editingId){
        // Try to find from modal title or hidden field
        const hiddenEdit = form.querySelector('[data-editing-id]');
        if(hiddenEdit) editingId = hiddenEdit.getAttribute('data-editing-id');
      }
      if(isDuplicateClientId(newId, editingId)){
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        clientIdInput.style.borderColor = 'red';
        clientIdInput.style.boxShadow = '0 0 0 2px rgba(255,0,0,0.2)';
        alert('❌ Duplicate Client ID!\n\nClient ID "'+newId+'" already exists.\nPlease use a different ID.');
        return false;
      }
    }

    // Permission check on submit
    const perm = getPermissions();
    const btn = document.activeElement;
    const isDeleteAction = (btn && (btn.innerText||'').toLowerCase()==='delete') || formText.includes('delete');
    const isEditAction = (btn && (btn.innerText||'').toLowerCase()==='edit') || formText.includes('update');
    
    if(isDeleteAction && !perm.canDelete){
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      alert('⛔ Permission Denied!\nYou ('+getCurrentUser().role+') cannot DELETE.');
      return false;
    }
    if(isEditAction && !perm.canEdit){
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      alert('⛔ Permission Denied!\nYou cannot EDIT.');
      return false;
    }
    // Add check - if form is for new entry and not edit
    const h2 = document.querySelector('h2, h3');
    const isAddForm = (h2 && /add new/i.test(h2.innerText||'')) || form.querySelector('button')?.innerText.toLowerCase().includes('add');
    if(isAddForm && !perm.canAdd){
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      alert('⛔ Permission Denied!\nYou cannot ADD new data.');
      return false;
    }

  }, true);

  // Intercept localStorage save to double-check duplicate (extra safety)
  const origSetItem = localStorage.setItem.bind(localStorage);
  localStorage.setItem = function(key, val){
    try{
      if(key==='carnival_local_state'){
        const obj = JSON.parse(val);
        if(obj.clients && Array.isArray(obj.clients)){
          const seen = new Set();
          for(let c of obj.clients){
            const cid = String(c.clientId||c.client_id||'').trim().toLowerCase();
            if(!cid) continue;
            if(seen.has(cid)){
              // Duplicate found - block save and alert
              console.error('Duplicate Client ID blocked:', cid);
              alert('❌ Save blocked! Duplicate Client ID found: '+c.clientId+'\nPlease fix before saving.');
              // Remove duplicate (keep first)
              const filtered = [];
              const seen2 = new Set();
              for(let cc of obj.clients){
                const id2 = String(cc.clientId||cc.client_id||'').trim().toLowerCase();
                if(!id2 || !seen2.has(id2)){ filtered.push(cc); if(id2) seen2.add(id2); }
              }
              obj.clients = filtered;
              val = JSON.stringify(obj);
              break;
            }
            seen.add(cid);
          }
        }
      }
    }catch(e){}
    return origSetItem(key, val);
  };

  // Run permission enforce loop
  function initV7(){
    enforcePermissions();
    const obs = new MutationObserver(()=>{ enforcePermissions(); });
    obs.observe(document.body, {childList:true, subtree:true});
    setInterval(enforcePermissions, 1000);
    console.log('✅ V7 ACTIVE: Permission='+JSON.stringify(getPermissions())+' User='+getCurrentUser().username+' Role='+getCurrentUser().role);
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', initV7);
  }else{
    initV7();
  }

  // Helper: How to set permissions - expose function
  window.setUserPermission = function(username, perms){
    // perms = {add:true, edit:true, delete:false, role:'manager'}
    try{
      const raw = localStorage.getItem('carnival_local_state');
      if(!raw) return alert('No state found');
      const state = JSON.parse(raw);
      let u = (state.users||[]).find(x=>x.username===username);
      if(!u) return alert('User not found: '+username);
      u.permissions = perms;
      if(perms.role) u.role = perms.role;
      localStorage.setItem('carnival_local_state', JSON.stringify(state));
      if(window._sb){
        window._sb.from('users').upsert([u], {onConflict:'id'}).then(()=>alert('Permission updated for '+username));
      }else{
        alert('Permission updated locally for '+username+' - Please refresh');
      }
    }catch(e){ alert('Error: '+e.message); }
  };

  console.log('V7 Permission + Duplicate Check Loaded. Use setUserPermission("username", {add:true, edit:true, delete:false, role:"manager"}) in console to set.');
})();
</script>

    return '<svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M19.05 4.93A9.82 9.82 0 0 0 12.03 2C6.56 2 2.11 6.45 2.11 11.92c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.82 9.82 0 0 0 4.78 1.22h.01c5.47 0 9.92-4.45 9.92-9.92 0-2.65-1.03-5.14-2.91-7.02zm-7.02 15.2h-.01a8.15 8.15 0 0 1-4.15-1.14l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.36c0-4.54 3.7-8.24 8.26-8.24 2.21 0 4.28.86 5.84 2.42a8.18 8.18 0 0 1 2.41 5.83c0 4.55-3.7 8.25-8.26 8.25zm4.53-6.17c-.25-.12-1.47-.73-1.7-.81-.23-.09-.4-.12-.57.12-.17.25-.65.81-.8.97-.15.17-.3.19-.55.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.38-1.72-.15-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.15.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.57-1.37-.78-1.88-.21-.5-.42-.43-.57-.44h-.49c-.17 0-.43.06-.66.31-.23.25-.87.85-.87 2.07s.89 2.4 1.01 2.57c.12.17 1.75 2.67 4.24 3.75.59.26 1.05.41 1.41.52.59.19 1.13.16 1.55.1.47-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.11-.23-.17-.48-.29z"/></svg>';
  }
  function whatsappOpen(text){
    if(!text || !text.trim()){ alert("No data!"); return; }
    window.open("https://api.whatsapp.com/send?text="+encodeURIComponent(text), "_blank");
  }
  function parseTooltipAndStore(){
    document.querySelectorAll('div.fixed.z-50').forEach(tip=>{
      const txt=(tip.innerText||"");
      const mId=txt.match(/CL-\s*\d+/i);
      if(!mId) return;
      const clientId=mId[0].replace(/\s+/g,'').toUpperCase();
      const lines=txt.split("\n").map(s=>s.trim()).filter(Boolean);
      if(lines.length<2) return;
      const data={clientId};
      lines.forEach(line=>{
        if(/^CL-\s*\d+/i.test(line)) data.clientId=line.replace(/\s+/g,'').toUpperCase();
        else if(/^[0-9+\-\s]+$/.test(line.replace(/\s/g,'')) && line.length>=8) data.phone=line;
        else if(/^[0-9.]+,\s*[0-9.]+$/.test(line)){ const parts=line.split(','); data.lat=parts[0].trim(); data.lng=parts[1].trim(); }
        else if(!data.name) data.name=line;
        else if(!data.address) data.address=line;
        else if(!data.cableInfo) data.cableInfo=line;
      });
      window.__clientTooltipData[clientId]=data;
    });
  }

  function clientMessage(card){
    let clientId="", clientName="", clientAddress="", contactNumber="", clientLat="", clientLng="", cableInfo="";
    try{
      const state=getState();
      const allClients=state.clients||[];
      let obj=null;
      const cid=card.id ? card.id.replace('client-','') : "";
      if(cid) obj=allClients.find(c=>String(c.id)===String(cid));
      const idMatch=(card.textContent||"").match(/CL-\s*\d+/i);
      if(idMatch) clientId=idMatch[0].replace(/\s+/g,'').toUpperCase();
      if(!obj && clientId) obj=allClients.find(c=>String(c.clientId).toUpperCase()===String(clientId).toUpperCase());
      if(obj){
        clientId=obj.clientId||clientId;
        clientName=obj.name||"";
        clientAddress=obj.address||"";
        contactNumber=obj.phone||obj.mobile||"";
        clientLat=obj.lat||obj.latitude||"";
        clientLng=obj.lng||obj.longitude||"";
        cableInfo=obj.cableInfo||obj.cable_info||"";
      }
    }catch(e){}
    // DOM FALLBACK - Fix for CL-4025 / CL-9466
    try{
      const rawText=(card.innerText||card.textContent||"");
      let cleanText=rawText.replace(/Edit\s*Delete/g,'').trim();
      let lines=cleanText.split("\n").map(s=>s.trim()).filter(s=>s && s.length>0);
      if(!contactNumber){
        const pm=cleanText.match(/01\d{9}/);
        if(pm) contactNumber=pm[0];
      }
      if(!clientLat || !clientLng){
        const ll=cleanText.match(/(\d{2}\.\d{4,})[,\s]+(\d{2,3}\.\d{4,})/);
        if(ll){ clientLat=ll[1]; clientLng=ll[2]; }
      }
      if(!cableInfo){
        for(let line of lines){
          const low=line.toLowerCase();
          if((low.includes('drop') || low.includes('odf')) && line.length<60){ cableInfo=line; break; }
        }
      }
      let remaining=[];
      for(let line of lines){
        if(line===clientId) continue;
        if(line===contactNumber) continue;
        if(line.includes(clientLat) && line.includes(clientLng)) continue;
        if(line===cableInfo) continue;
        if(/\d{2}\.\d+.*\d{2,3}\.\d+/.test(line)) continue;
        remaining.push(line);
      }
      if(!clientName && remaining.length>0){
        for(let r of remaining){
          const low=r.toLowerCase();
          if(low.includes('house') || low.includes('road') || low.includes('flat') || low.includes('building') || low.includes('floor') || low.includes('dhaka')) continue;
          if(r.length>=3 && r.length<=60){ clientName=r; break; }
        }
        if(!clientName) clientName=remaining[0]||"";
      }
      if(!clientAddress && remaining.length>0){
        for(let r of remaining){
          if(r===clientName) continue;
          const low=r.toLowerCase();
          if(low.includes('house') || low.includes('road') || low.includes('flat') || low.includes('dhaka') || low.includes('building')){
            clientAddress=r; break;
          }
        }
        if(!clientAddress && remaining.length>=2){
          let idx=remaining.indexOf(clientName);
          if(idx>=0 && idx+1<remaining.length) clientAddress=remaining[idx+1];
        }
      }
    }catch(e){}
    try{
      if(clientId && window.__clientTooltipData[clientId]){
        const t=window.__clientTooltipData[clientId];
        if(!clientName) clientName=t.name||"";
        if(!clientAddress) clientAddress=t.address||"";
        if(!contactNumber) contactNumber=t.phone||"";
        if(!clientLat) clientLat=t.lat||"";
        if(!clientLng) clientLng=t.lng||"";
        if(!cableInfo) cableInfo=t.cableInfo||"";
      }
    }catch(e){}
    let splitterName="", splitterAddr="";
    try{
      const state=getState();
      const allSecond=state.second_splitters||state.secondSplitters||[];
      let sid=null;
      try{
        const allClients=state.clients||[];
        const cid=card.id ? card.id.replace('client-','') : "";
        let obj=null;
        if(cid) obj=allClients.find(c=>String(c.id)===String(cid));
        if(obj) sid=obj.secondSplitterId||obj.second_splitter_id;
      }catch(e){}
      if(sid){
        const sObj=allSecond.find(s=>String(s.id)===String(sid));
        if(sObj){ splitterName=sObj.name||""; splitterAddr=sObj.address||""; if(splitterAddr.includes("•")) splitterAddr=splitterAddr.split("•")[0].trim(); }
      }
      if(!splitterName){
        for(let h of document.querySelectorAll('h3')){
          const t=(h.innerText||"").trim();
          if(/SS-\d+-\d+/i.test(t)){ splitterName=t.split("•")[0].trim(); break; }
        }
      }
      if(!splitterAddr && splitterName){
        const sObj=allSecond.find(s=>String(s.name).trim().toUpperCase()===String(splitterName).trim().toUpperCase());
        if(sObj){ splitterAddr=sObj.address||""; if(splitterAddr.includes("•")) splitterAddr=splitterAddr.split("•")[0].trim(); }
      }
    }catch(e){}
    const lines=[];
    if(clientId) lines.push(clientId);
    if(clientName) lines.push(clientName);
    if(clientAddress) lines.push(clientAddress);
    if(contactNumber) lines.push(contactNumber);
    if(clientLat && clientLng) lines.push(clientLat + ", " + clientLng);
    else if(clientLat || clientLng) lines.push(clientLat || clientLng);
    if(cableInfo) lines.push(cableInfo);
    lines.push("");
    lines.push("Splitter info :");
    if(splitterName) lines.push(splitterName + " ");
    if(splitterAddr) lines.push(splitterAddr);
    return lines.join("\n");
  }

  function splitterMessage(card, type){
    let name="", address="", lat="", lng="";
    try{
      const h3=card.querySelector('h3');
      if(h3) name=(h3.innerText||"").split("•")[0].trim();
      const ps=Array.from(card.querySelectorAll('p'));
      if(ps.length>=1) address=ps[0].innerText.trim().split("•")[0].trim();
      if(ps.length>=2){
        const ll=ps[1].innerText.trim();
        if(ll.includes(",")){ const pr=ll.split(","); lat=pr[0].trim(); lng=pr[1].trim(); }
      }
    }catch(e){}
    const out=[];
    if(name) out.push(name);
    if(address) out.push(address);
    if(lat||lng) out.push((lat&&lng)?lat+", "+lng:(lat||lng));
    return out.join("\n");
  }

  function addClientButton(card){
    if(!card || card.querySelector('[class*="wa-client-btn"]')) return;
    if(getComputedStyle(card).position==="static") card.style.position="relative";
    const btn=document.createElement("button");
    btn.className="wa-client-btn-v28";
    btn.innerHTML=iconSVG();
    btn.style.cssText="position:absolute!important;top:6px!important;left:6px!important;width:28px!important;height:28px!important;display:flex!important;align-items:center!important;justify-content:center!important;border:0!important;border-radius:50%!important;background:#25D366!important;cursor:pointer!important;z-index:20!important;";
    btn.onclick=function(e){ e.preventDefault(); e.stopPropagation(); whatsappOpen(clientMessage(card)); };
    card.appendChild(btn);
  }
  function addSplitterButton(card, type){
    if(!card || card.querySelector('[class*="wa-splitter-btn"]')) return;
    if(getComputedStyle(card).position==="static") card.style.position="relative";
    const btn=document.createElement("button");
    btn.className="wa-splitter-btn-v28";
    btn.innerHTML=iconSVG();
    btn.style.cssText="position:absolute!important;top:6px!important;right:6px!important;width:28px!important;height:28px!important;display:flex!important;align-items:center!important;justify-content:center!important;border:0!important;border-radius:6px!important;background:#25D366!important;cursor:pointer!important;z-index:20!important;";
    btn.onclick=function(e){ e.preventDefault(); e.stopPropagation(); whatsappOpen(splitterMessage(card, type)); };
    card.appendChild(btn);
  }
  function addPinButton(card){
    if(!card || card.querySelector('.pin-btn-v28')) return;
    if(!card.id || !card.id.startsWith('client-')) return;
    if(getComputedStyle(card).position==="static") card.style.position="relative";
    const btn=document.createElement('button');
    btn.className='pin-btn-v28';
    btn.title='Open in Google Maps';
    btn.innerHTML='📍';
    btn.style.cssText="position:absolute!important;top:50%!important;right:8px!important;transform:translateY(-50%)!important;width:32px!important;height:32px!important;display:flex!important;align-items:center!important;justify-content:center!important;background:#0f172a!important;color:white!important;border:1px solid #1e293b!important;border-radius:50%!important;font-size:14px!important;cursor:pointer!important;z-index:25!important;box-shadow:0 2px 8px rgba(0,0,0,0.2)!important;";
    btn.onclick=function(e){
      e.preventDefault(); e.stopPropagation();
      try{
        let lat='', lng='', clientId='';
        const state=getState();
        const cid=card.id?card.id.replace('client-',''):"";

        // 1. From state by internal id
        let obj=(state.clients||[]).find(c=>String(c.id)===String(cid));
        // 2. From state by CL-xxx
        const m=(card.textContent||"").match(/CL-\s*\d+/i);
        if(m) clientId=m[0].replace(/\s+/g,'').toUpperCase();
        if(!obj && clientId) obj=(state.clients||[]).find(c=>String(c.clientId||'').toUpperCase()===clientId);

        if(obj){
          lat=obj.lat||obj.latitude||obj.Lat||obj.LAT||"";
          lng=obj.lng||obj.longitude||obj.Lng||obj.LNG||obj.long||"";
        }
        // 3. Fallback tooltip data
        if((!lat||!lng) && clientId && window.__clientTooltipData && window.__clientTooltipData[clientId]){
          const t=window.__clientTooltipData[clientId];
          if(!lat) lat=t.lat||""; if(!lng) lng=t.lng||"";
        }
        // 4. Fallback parse from card DOM text
        if(!lat||!lng){
          const txt=card.innerText||"";
          const ll=txt.match(/(\d{2}\.\d{3,})\s*[,\s]+\s*(\d{2,3}\.\d{3,})/);
          if(ll){ lat=ll[1]; lng=ll[2]; }
        }
        lat=String(lat||'').trim(); lng=String(lng||'').trim();
        if(lat && lng){
          window.open('https://www.google.com/maps?q='+encodeURIComponent(lat+','+lng), '_blank');
        }else{
          alert('📍 Location not set for this client'+(clientId?' ('+clientId+')':'')+'\n\nPlease edit client and add Latitude / Longitude.');
        }
      }catch(err){
        console.error('Pin btn error', err);
        alert('Map open failed: '+err.message);
      }
    };
    // make space for pin so Edit/Delete not hidden
    const actionArea=card.querySelector('.flex.gap-2');
    if(actionArea) actionArea.style.marginRight='48px';
    // ensure card has enough padding
    card.style.paddingRight='44px';
    card.appendChild(btn);
  }
  function getCards(){
    // FIXED: Simple valid selector - no rounded-[20px]
    const clientCards=Array.from(document.querySelectorAll('div[id^="client-"]'));
    const mainRoot=document.querySelector('main')||document.body;
    const allDivs=mainRoot.querySelectorAll('div.bg-white');
    const splitterCards=Array.from(allDivs).filter(el=>{
      if(el.id && el.id.startsWith('client-')) return false;
      const t=(el.innerText||"");
      if(!(t.includes("Edit") && t.includes("Delete"))) return false;
      if(t.length>2000) return false;
      return true;
    });
    return {clientCards, splitterCards};
  }
  function run(){
    const h1=(document.querySelector("h1")?.innerText||"").toLowerCase();
    const isPopPage=h1.includes("pop") && !h1.includes("splitter") && !h1.includes("client");
    const isOltPage=h1.includes("olt");
    const isPortPage=h1.includes("port") && !h1.includes("splitter");
    const isZonePage=h1.includes("zone");
    if(isPopPage || isOltPage || isPortPage || isZonePage){
      document.querySelectorAll('[class*="wa-client-btn"], [class*="wa-splitter-btn"]').forEach(b=>b.remove());
      return;
    }
    const {clientCards, splitterCards}=getCards();
    clientCards.forEach(card=>{ addClientButton(card); addPinButton(card); });
    if(h1.includes("splitter") || h1.includes("1st") || h1.includes("2nd")){
      const type=(h1.includes("1st")||h1.includes("first"))?"first":"second";
      splitterCards.forEach(card=> addSplitterButton(card, type));
    }
    parseTooltipAndStore();
  }
  function init(){
    run();
    const obs=new MutationObserver(()=>run());
    obs.observe(document.body, {childList:true, subtree:true});
    setInterval(run, 1500);
    setInterval(parseTooltipAndStore, 1000);
    console.log('V28 ACTIVE - Fixed invalid selector + Full Data');
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

<script>
(function(){
  async function sha256(str){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  async function ensureAllUsers(){
    try{
      let keys = ['fibernet_v2_data', 'carnival_local_state'];
      for(let key of keys){
        let raw = localStorage.getItem(key);
        if(!raw) continue;
        let state = JSON.parse(raw);
        if(!state.users) state.users = [];
        // Default users with hashed passwords
        const defaults = [
          {id:'u1', username:'admin', plain:'admin123', role:'admin'},
          {id:'u2', username:'installer', plain:'installer123', role:'installer'},
          {id:'u3', username:'viewer', plain:'viewer123', role:'viewer'}
        ];
        for(let def of defaults){
          let existing = state.users.find(u=>u.username===def.username);
          let h = await sha256(def.plain);
          if(!existing){
            state.users.push({id:def.id, username:def.username, password:h, role:def.role});
          }else{
            // If password is plain text, convert to hash, or if missing, set hash
            if(existing.password===def.plain || existing.password===def.username || !existing.password){
              existing.password = h;
            }
          }
        }
        localStorage.setItem(key, JSON.stringify(state));
      }
    }catch(e){}
  }
  ensureAllUsers();

  // Universal login interceptor - works for all 3 users
  document.addEventListener('click', async (e)=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    if(true) return; // Disabled legacy local login interceptor; backend /api/login is authoritative.
    try{
      const textInputs = [...document.querySelectorAll('input[type="text"], input:not([type])')].filter(i=>i.offsetParent!==null);
      const passInputs = [...document.querySelectorAll('input[type="password"]')].filter(i=>i.offsetParent!==null);
      let u = textInputs.length ? textInputs[textInputs.length-1].value.trim() : '';
      let p = passInputs.length ? passInputs[passInputs.length-1].value : '';
      if(!u || !p) return;
      let hp = await sha256(p);
      // Check in all possible storages
      let allUsers = [];
      try{
        let v2 = JSON.parse(localStorage.getItem('fibernet_v2_data')||'{}');
        if(v2.users) allUsers = allUsers.concat(v2.users);
      }catch{}
      try{
        let old = JSON.parse(localStorage.getItem('carnival_local_state')||'{}');
        if(old.users) allUsers = allUsers.concat(old.users);
      }catch{}
      // Deduplicate
      const map = new Map();
      allUsers.forEach(x=>{ if(x.username) map.set(x.username, x); });
      let users = Array.from(map.values());
      // Also add defaults if not present
      if(users.length===0){
        users = [
          {username:'admin', password: await sha256('admin123'), role:'admin'},
          {username:'installer', password: await sha256('installer123'), role:'installer'},
          {username:'viewer', password: await sha256('viewer123'), role:'viewer'}
        ];
      }
      let found = users.find(x =>
  x.username.toLowerCase() === u.toLowerCase() &&
  (x.password === hp || x.password === p)
);
      // Extra check for plain match
      if(!found){
        found = users.find(x=> x.username.toLowerCase()===u.toLowerCase() && (p===x.username+'123' || p===x.username || p==='admin123' && x.username==='admin'));
      }
      // Final fallback for known users
      const allowed = {
        'admin': ['admin123','admin'],
        'installer': ['installer123','installer'],
        'viewer': ['viewer123','viewer']
      };
      if(!found && allowed[u.toLowerCase()] && allowed[u.toLowerCase()].includes(p)){
        found = {id: u.toLowerCase()+'-id', username: u.toLowerCase(), role: u.toLowerCase()==='admin'?'admin':u.toLowerCase(), password: hp};
      }
      
      if(found){
        e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
        localStorage.setItem('fibernet_user', JSON.stringify({id:found.id||found.username, username:found.username, role:found.role||'viewer'}));
        try{
          const br = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
          const bd = await br.json().catch(()=>({}));
          if(br.ok && bd.token){
            sessionStorage.setItem('carnival_token', bd.token);
            localStorage.setItem('carnival_auth_user', JSON.stringify(bd.user||{id:found.id||found.username,username:found.username,role:found.role||'viewer'}));
            console.log('✅ BACKEND LOGIN SUCCESS');
          }else{
            console.warn('⚠️ Local login works, but backend login rejected:', bd.error||br.status);
          }
        }catch(be){ console.warn('⚠️ Backend login bridge unavailable:', be.message); }
        console.log('✅ LOGIN SUCCESS', found.username);
        location.reload();
        return false;
      }else{
        console.log('❌ LOGIN FAILED for', u);
      }
    }catch(err){ console.error(err); }
  }, true);
  console.log('🔓 UNIVERSAL LOGIN FIX ACTIVE - admin/admin123, installer/installer123, viewer/viewer123');
})();
</script>
